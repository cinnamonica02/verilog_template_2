name: test
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install iverilog
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python packages
        shell: bash
        run: uv sync

      - name: Run tests
        run: |
          uv run make -C test clean
          uv run make -C test
          # make will return success even if the test fails, so check for failure in the results.xml
          ! grep failure test/results.xml

      - name: Test Summary
        uses: test-summary/action@v2.4
        with:
          paths: "test/results.xml"
        if: always()

      - name: upload waveform and test results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            test/tb.fst
            test/results.xml
            test/output/*

  verilator-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Install Verilator
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Run Verilator C++ runtime
        run: make -C runtime run

      - name: Run custom signed and saturation case
        run: |
          python3 runtime/reference.py runtime/custom_program.bin runtime/custom_expected.bin \
            --a 127 127 -128 127 \
            --b 127 127 127 127
          runtime/obj_dir/Vtt_um_bjarke_micro_mac \
            runtime/custom_program.bin runtime/custom_expected.bin

      - name: Upload runtime waveform
        uses: actions/upload-artifact@v7
        with:
          name: verilator-mxu-waveform
          path: runtime/mxu.vcd
